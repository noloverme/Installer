name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (optional, e.g. v1.2.0)'
        required: false
        default: ''
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag_name: ${{ steps.ver.outputs.tag_name }}
      release_name: ${{ steps.ver.outputs.release_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version & tags
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            echo "version=${TAG}" >> $GITHUB_OUTPUT
            echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
            echo "release_name=${TAG}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
            echo "version=${TAG}" >> $GITHUB_OUTPUT
            echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
            echo "release_name=${TAG}" >> $GITHUB_OUTPUT
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.2.0")
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "version=${LATEST_TAG}-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "tag_name=latest" >> $GITHUB_OUTPUT
            echo "release_name=Release ${LATEST_TAG} (${SHORT_SHA})" >> $GITHUB_OUTPUT
          fi

  build-linux:
    name: Build Linux CLI
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Build CLI
        run: make VERSION=${{ needs.prepare.outputs.version }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VencordInstaller-linux
          path: build/*
          if-no-files-found: error

  build-mac:
    name: Build macOS DMG & CLI
    needs: prepare
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install dependencies
        run: brew install pkg-config sdl2 create-dmg

      - name: Setup Certificates
        if: ${{ secrets.APPLE_SIGNING_CERT != '' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_SIGNING_CERT }}
          p12-password: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}

      - name: Build
        run: |
          make ARCH=universal VERSION=${{ needs.prepare.outputs.version }}
          IDENTITY="${{ secrets.APPLE_IDENTITY_NAME }}"
          if [ -z "$IDENTITY" ]; then
            IDENTITY="-"
          fi
          make ARCH=universal GUI=1 DMG=1 IDENTITY="$IDENTITY" VERSION=${{ needs.prepare.outputs.version }}

      - name: Codesign and Notarize
        if: ${{ secrets.APPLE_SIGNING_CERT != '' && secrets.APPLE_ID_EMAIL != '' }}
        run: |
          xcrun notarytool submit build/VencordInstaller.dmg --apple-id "${{ secrets.APPLE_ID_EMAIL }}" --password "${{ secrets.APPLE_ID_PASSWORD }}" --team-id "${{ secrets.APPLE_ID_TEAM }}" --wait
          xcrun stapler staple build/VencordInstaller.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VencordInstaller-macos
          path: |
            build/VencordInstaller.dmg
            build/VencordInstallerCli-darwin
          if-no-files-found: error

  build-windows:
    name: Build Windows GUI & CLI
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-go
            make

      - name: Build Windows binaries
        shell: msys2 {0}
        run: |
          export GOROOT=/mingw64/lib/go
          export GOPATH=/mingw64
          export PATH=/mingw64/bin:$PATH
          go install github.com/tc-hib/go-winres@d743268d7ea168077ddd443c4240562d4f5e8c3e
          make GUI=1 VERSION=${{ needs.prepare.outputs.version }}
          make ARCH=386 VERSION=${{ needs.prepare.outputs.version }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VencordInstaller-windows
          path: build/*.exe
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [prepare, build-linux, build-mac, build-windows]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Display assets
        run: ls -la release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: ${{ needs.prepare.outputs.release_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          files: release-assets/*
